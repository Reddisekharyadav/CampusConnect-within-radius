<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusRadius — Settings</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        background: #f7f9ff;
        color: #1e293b;
        min-width: 340px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 20px;
        color: #1e3a8a;
      }
      p.subtitle {
        margin: 0 0 20px;
        color: #64748b;
        font-size: 13px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
        margin-top: 16px;
        font-size: 14px;
      }
      input[type="url"],
      input[type="text"] {
        width: 100%;
        border: 1px solid #d4def9;
        border-radius: 8px;
        padding: 9px 12px;
        font: inherit;
        font-size: 14px;
        background: #fff;
        outline-offset: 2px;
      }
      input:focus {
        outline: 2px solid #2563eb;
        border-color: #2563eb;
      }
      .hint {
        font-size: 12px;
        color: #64748b;
        margin-top: 5px;
      }
      .btn-row {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      button {
        padding: 9px 18px;
        border: none;
        border-radius: 8px;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      button:active { opacity: 0.75; }
      .btn-primary { background: #2563eb; color: #fff; }
      .btn-primary:hover { background: #1d4ed8; }
      .btn-secondary { background: #dbe7ff; color: #1e3a8a; }
      #status {
        margin-top: 14px;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        display: none;
      }
      #status.success { background: #dcfce7; color: #166534; display: block; }
      #status.error   { background: #fee2e2; color: #991b1b; display: block; }
      .divider {
        border: none;
        border-top: 1px solid #e4e8f5;
        margin: 20px 0;
      }
      .preset-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }
      .preset {
        padding: 5px 10px;
        background: #eef3ff;
        border: 1px solid #bfd0ff;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        color: #1e3a8a;
        cursor: pointer;
        transition: background 0.15s;
      }
      .preset:hover { background: #dbe7ff; }
    </style>
  </head>
  <body>
    <h1>⚙️ CampusRadius Settings</h1>
    <p class="subtitle">Configure your extension preferences.</p>

    <label for="api-url">Backend API URL</label>
    <input
      type="url"
      id="api-url"
      placeholder="http://localhost:5000"
      spellcheck="false"
      autocomplete="off"
    />
    <p class="hint">
      The URL of the CampusRadius backend server. Use <code>http://localhost:5000</code> for local
      dev, or paste your Cloud Run URL for production.
    </p>

    <div class="preset-row">
      <span class="preset" data-url="http://localhost:5000">localhost:5000</span>
      <span class="preset" data-url="http://localhost:3000">localhost:3000</span>
    </div>

    <hr class="divider" />

    <div class="btn-row">
      <button class="btn-primary" id="save-btn">Save Settings</button>
      <button class="btn-secondary" id="reset-btn">Reset to Default</button>
    </div>

    <div id="status"></div>

    <script src="options.js"></script>
  </body>
</html>
